<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login • Career Mirror</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    .wrap { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 32px 16px; }
    .card { background: var(--card-bg); width: 100%; max-width: 420px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.08); border: 1px solid #e5e7eb; }
    .input { width: 100%; padding: 12px 14px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 8px; font-family: inherit; }
    .button { margin-top: 16px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; font-weight: 600; width: 100%; }
    .hint { color: #6b7280; font-size: .95rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="bg-3d" aria-hidden="true"><div class="orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div></div>
  <div class="wrap container">
    <div class="card">
      <h2 style="margin:0 0 10px 0">Login</h2>
      <div class="hint">Use your email and password.</div>
      <form id="loginForm">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <input class="input" type="password" id="password" placeholder="••••••••" required>
        <button class="button" type="submit">Login</button>
        <div id="msg" class="hint"></div>
      </form>
    </div>
  </div>

  <script src="/js/shared.js"></script>
  <script src="/login.js"></script>
  <script>
    CareerMirror.ensureBase();
    CareerMirror.buildNavbar('/upload.html');
    CareerMirror.buildFooter();
  </script>
</body>
</html>
